<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://ycljqpwpeoonqisqdrws.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Relatório de saúde — NERO</title>
<style>
  :root { --marinho:#0f2d63; --grafite:#4A5C7A; --borda:#DCE2EE; --fundo:#F5F7FB; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--fundo); color:#1D2E45;
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px;
           padding:10px 16px; background:var(--marinho); color:#fff; }
  .marca { font-weight:700; letter-spacing:1.5px; font-size:17px }
  .marca small { font-weight:400; letter-spacing:0; opacity:.85; margin-left:6px; font-size:14px }
  #baixar { display:inline-block; padding:9px 16px; border-radius:8px; background:#fff; color:var(--marinho);
            font-weight:600; font-size:15px; text-decoration:none; white-space:nowrap }
  #baixar[hidden] { display:none }
  #baixar:focus-visible { outline:3px solid #9fc6ff; outline-offset:2px }
  main { max-width:820px; margin:0 auto }
  #aviso { margin:48px 16px; padding:22px 20px; background:#fff; border:1px solid var(--borda); border-radius:12px;
           color:var(--grafite); text-align:center }
  #aviso p { margin:6px 0 }
  .aviso-titulo { color:var(--marinho); font-weight:600; font-size:18px }
  #relatorio { background:#fff }
  #relatorio iframe { display:block; width:100%; height:80vh; border:0 }
</style>
</head>
<body>
<header>
  <span class="marca">NERO<small>Relatório de saúde</small></span>
  <a id="baixar" href="#" target="_blank" rel="noopener" hidden>Baixar PDF</a>
</header>
<main>
  <div id="aviso" role="status" aria-live="polite">Abrindo o relatório…</div>
  <div id="relatorio" hidden></div>
</main>
<script type="module" src="relatorio.js" data-supabase="https://ycljqpwpeoonqisqdrws.supabase.co"></script>
</body>
</html>
